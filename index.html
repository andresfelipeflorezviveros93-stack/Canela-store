<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           VARIABLES & CSS RESET
           ========================================== */
        :root {
            --bg-main: #030611;
            --bg-gradient-top: #0a1329;
            --bg-gradient-bottom: #020307;
            --accent-blue: #0071e3;
            --electric-blue: #00f0ff;
            --gold-accent: #dfb15b;
            --gold-glow: rgba(223, 177, 91, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-hover-bg: rgba(255, 255, 255, 0.09);
            --glass-hover-border: rgba(0, 240, 255, 0.4);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at 50% 0%, var(--bg-gradient-top) 0%, var(--bg-gradient-bottom) 70%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px 80px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Orbs */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.25) 0%, rgba(0, 240, 255, 0.08) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(223, 177, 91, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        /* Container Limit */
        .main-container {
            width: 100%;
            max-width: 440px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ==========================================
           HEADER SECTION (LOGO & INFO)
           ========================================== */
        .profile-header {
            text-align: center;
            margin-bottom: 32px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Halo & Animation */
        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            animation: fadeInLogo 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .logo-halo {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--electric-blue), var(--gold-accent), var(--accent-blue), var(--electric-blue));
            filter: blur(14px);
            opacity: 0.65;
            animation: rotateHalo 10s linear infinite;
        }

        .logo-img-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255,255,255,0.4), rgba(223, 177, 91, 0.6), rgba(0, 240, 255, 0.4));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #000;
            display: block;
        }

        .store-name {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
        }

        .store-tagline {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
        }

        .tagline-dot {
            width: 4px;
            height: 4px;
            background-color: var(--gold-accent);
            border-radius: 50%;
            display: inline-block;
        }

        /* ==========================================
           BUTTONS / LINKS LIST
           ========================================== */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-primary);
            text-decoration: none;
            box-shadow: var(--shadow-card);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Staggered entrance animations */
        .link-card:nth-child(1) { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.65s; }
        .link-card:nth-child(2) { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.80s; }
        .link-card:nth-child(3) { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.95s; }
        .link-card:nth-child(4) { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.10s; }

        /* Inner Shimmer Effect */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left 0.75s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        /* Hover & Touch Active Effects */
        .link-card:hover, .link-card:active {
            background: var(--glass-hover-bg);
            border-color: var(--glass-hover-border);
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 12px 28px rgba(0, 240, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        .link-card:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Card Content Layout */
        .link-content-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .link-card:hover .link-icon-box {
            background: rgba(0, 240, 255, 0.1);
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--electric-blue);
        }

        .link-icon-box svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-icon-box svg {
            transform: scale(1.1);
        }

        .link-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .link-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .link-subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .link-arrow {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .link-card:hover .link-arrow {
            opacity: 1;
            color: var(--gold-accent);
            transform: translateX(4px);
        }

        /* Individual Custom Accents per Button */
        .btn-catalog .link-icon-box {
            color: #ffaa00;
        }
        .btn-whatsapp .link-icon-box {
            color: #25d366;
        }
        .btn-instagram .link-icon-box {
            color: #e1306c;
        }
        .btn-tiktok .link-icon-box {
            color: #00f0ff;
        }

        /* Gold highlight border for PDF Catalog */
        .btn-catalog {
            border: 1px solid rgba(223, 177, 91, 0.3);
        }
        .btn-catalog:hover {
            border-color: var(--gold-accent);
            box-shadow: 0 12px 28px rgba(223, 177, 91, 0.2), 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* ==========================================
           FLOATING WHATSAPP BUTTON
           ========================================== */
        .float-whatsapp {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
            z-index: 99;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulseFloat 3s infinite ease-in-out;
        }

        .float-whatsapp svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
        }

        .float-whatsapp:hover, .float-whatsapp:active {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
        }

        /* ==========================================
           FOOTER
           ========================================== */
        footer {
            margin-top: 48px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.25s;
        }

        footer span {
            color: var(--gold-accent);
        }

        /* ==========================================
           KEYFRAME ANIMATIONS
           ========================================== */
        @keyframes fadeInLogo {
            0% {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes rotateHalo {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-6px) scale(1.05);
            }
        }

        /* Responsive Tweaks */
        @media (max-width: 380px) {
            body {
                padding: 30px 16px 70px 16px;
            }
            .logo-wrapper {
                width: 110px;
                height: 110px;
            }
            .store-name {
                font-size: 1.5rem;
            }
            .link-card {
                padding: 14px 16px;
            }
            .float-whatsapp {
                width: 52px;
                height: 52px;
                bottom: 18px;
                right: 18px;
            }
        }
    </style>
</head>
