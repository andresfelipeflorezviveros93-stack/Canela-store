<head>

    <meta name="theme-color" content="#030712">

    <!-- Fonts: Inter / SF Pro style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           RESET & BASIC STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }

        /* ==========================================================================
           DYNAMIC BACKGROUND (Apple / Samsung Tech Ambient Aesthetic)
           ========================================================================== */
        .bg-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            background: radial-gradient(circle at 50% 0%, #03132e 0%, #020617 60%, #000000 100%);
        }

        .bg-glow-orb-1 {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(13, 71, 161, 0.35) 0%, rgba(2, 132, 199, 0.1) 50%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .bg-glow-orb-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(1.15); opacity: 1; }
        }

        /* ==========================================================================
           MAIN CONTAINER & GLASSMORPHISM
           ========================================================================== */
        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .glass-card {
            width: 100%;
            background: rgba(10, 20, 38, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 36px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
        }

        /* Ambient subtle gold inner border reflection */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.3) 0%, rgba(14, 165, 233, 0.2) 50%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* ==========================================================================
           HEADER SECTION: LOGO & INFO
           ========================================================================== */
        .logo-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Animation 1: Logo enters first */
            opacity: 0;
            transform: scale(0.8) translateY(-10px);
            animation: logoAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .logo-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.4) 0%, rgba(212, 175, 55, 0.2) 60%, transparent 80%);
            filter: blur(14px);
            animation: haloPulse 4s ease-in-out infinite alternate;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        @keyframes logoAppear {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes haloPulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #f0c36d 70%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.4s;
        }

        .brand-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.2px;
            margin-bottom: 32px;
            line-height: 1.4;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 0.5s;
        }

        /* ==========================================================================
           BUTTONS CONTAINER & STYLES (Sequential Staggered Animation)
           ========================================================================== */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 20px;
            width: 100%;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            /* Animation state */
            opacity: 0;
            transform: translateY(20px);
            animation: btnSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Sequential Delays for Buttons */
        .btn-link:nth-child(1) { animation-delay: 0.6s; }
        .btn-link:nth-child(2) { animation-delay: 0.75s; }
        .btn-link:nth-child(3) { animation-delay: 0.9s; }
        .btn-link:nth-child(4) { animation-delay: 1.05s; }

        .btn-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .btn-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
            letter-spacing: -0.2px;
        }

        .btn-arrow {
            opacity: 0.4;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .btn-arrow svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Button Hover & Active States (Desktop & Mobile) */
        @media (hover: hover) {
            .btn-link:hover {
                transform: translateY(-3px) scale(1.02);
                background: rgba(30, 41, 59, 0.8);
                border-color: rgba(14, 165, 233, 0.4);
                box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25),
                            0 0 15px rgba(212, 175, 55, 0.15);
            }

            .btn-link:hover .btn-icon svg {
                transform: scale(1.15);
            }

            .btn-link:hover .btn-arrow {
                opacity: 1;
                transform: translateX(4px);
            }
        }

        .btn-link:active {
            transform: scale(0.97) !important;
            background: rgba(15, 23, 42, 0.9) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4) !important;
            transition: transform 0.1s ease, background 0.1s ease;
        }

        /* Specific Highlight Styles for Primary Buttons */
        .btn-catalog {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(15, 23, 42, 0.7) 100%);
            border-color: rgba(14, 165, 233, 0.3);
        }
        .btn-catalog .btn-icon { color: #38bdf8; }

        .btn-whatsapp {
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.12) 0%, rgba(15, 23, 42, 0.7) 100%);
            border-color: rgba(37, 211, 102, 0.25);
        }
        .btn-whatsapp .btn-icon { color: #25D366; }

        .btn-instagram {
            background: linear-gradient(135deg, rgba(225, 48, 108, 0.12) 0%, rgba(15, 23, 42, 0.7) 100%);
            border-color: rgba(225, 48, 108, 0.25);
        }
        .btn-instagram .btn-icon { color: #e1306c; }

        .btn-tiktok {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.7) 100%);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-tiktok .btn-icon { color: #ffffff; }

        /* ==========================================================================
           FLOATING WHATSAPP BUTTON (FAB)
           ========================================================================== */
        .fab-whatsapp {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #25D366 #00b33c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4),
                        0 0 0 0 rgba(37, 211, 102, 0.5);
            z-index: 99;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulseFab 2s infinite, fabAppear 0.5s ease forwards 1.2s;
            opacity: 0;
            transform: scale(0);
        }

        .fab-whatsapp svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        @keyframes fabAppear {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulseFab {
            0% {
                box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4), 0 0 0 0 rgba(37, 211, 102, 0.5);
            }
            70% {
                box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4), 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4), 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        .fab-whatsapp:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .fab-whatsapp:active {
            transform: scale(0.92);
        }

        /* ==========================================================================
           FOOTER
           ========================================================================== */
        .footer-text {
            margin-top: 28px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards 1.2s;
        }

        /* ==========================================================================
           KEYFRAME ANIMATIONS
           ========================================================================== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes btnSlideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Small screen responsive adjustments */
        @media (max-width: 380px) {
            .glass-card {
                padding: 28px 18px;
            }
            .logo-wrapper {
                width: 110px;
                height: 110px;
            }
            .brand-title {
                font-size: 22px;
            }
            .btn-link {
                padding: 14px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
