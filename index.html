<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canela Store - Servicio Técnico & Catálogo</title>
  <style>
    /* Estilos Generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Encabezado y Logo */
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-container {
      width: 150px;
      height: 150px;
      margin: 0 auto 15px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #d4af37; /* Borde dorado */
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 2rem;
      color: #d4af37;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    p.subtitle {
      color: #a0aec0;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Sección Principal del PDF */
    .catalog-container {
      width: 100%;
      max-width: 900px;
      background-color: #161e2e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2d3748;
      text-align: center;
    }
    .actions {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .btn {
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #000;
      font-weight: bold;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
    }

    /* Visor de PDF incorporado */
    .pdf-viewer {
      width: 100%;
      height: 650px;
      border: 1px solid #374151;
      border-radius: 8px;
      background-color: #0b0f19;
    }

    /* Adaptabilidad Móvil */
    @media (max-width: 600px) {
      .pdf-viewer {
        height: 450px;
      }
      .logo-container {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Encabezado con Logo -->
  <header>
    <div class="logo-container">
      <!-- Asegúrate de colocar la imagen del logo en la misma carpeta del proyecto -->
      <img src="478136.png" alt="Canela Store Logo">
    </div>
    <h1>Canela Store</h1>
    <p class="subtitle">Servicio Técnico & Catálogo de Celulares</p>
  </header>

  <!-- Sección Catálogo PDF -->
  <main class="catalog-container">
    <div class="actions">
      <!-- Botón para abrir el PDF en una pestaña nueva -->
      <a href="CATALOGO CANELA STORE.pdf" target="_blank" class="btn">
        📄 Abrir PDF en Pantalla Completa
      </a>
      <!-- Botón opcional para descargar -->
      <a href="CATALOGO CANELA STORE.pdf" download class="btn" style="background: #2d3748; color: #fff;">
        ⬇️ Descargar Catálogo
      </a>
    </div>

    <!-- Visor iframe para ver el PDF dentro de la misma página -->
    <iframe 
      class="pdf-viewer" 
      src="CATALOGO CANELA STORE.pdf#toolbar=1" 
      title="Catálogo Canela Store">
      <p>Tu navegador no soporta la vista previa del PDF. <a href="CATALOGO CANELA STORE.pdf">Haz clic aquí para verlo.</a></p>
    </iframe>
  </main>

</body>
</html>
